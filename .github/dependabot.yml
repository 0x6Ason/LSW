#
# Keeps the SHA-pinned actions and the exact-pinned crates moving. Cargo
# updates arrive as one grouped pull request so the lockfile, deny.toml, and
# THIRD_PARTY_NOTICES.md can be reviewed together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      crates:
        patterns: ["*"]
