# SPDX-License-Identifier: GPL-3.0-or-later

name: Windows/KVM release gate
run-name: Windows/KVM gate for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character master commit to validate
        required: true
        type: string
      confirmation:
        description: Type RUN-WINDOWS-KVM-E2E to use the dedicated runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-kvm-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted or ambiguous dispatches
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY,,}" != 0x6ason/lsw ]]; then
            echo "error: this gate can run only in 0x6Ason/LSW" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "error: select the master branch when dispatching this gate" >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != RUN-WINDOWS-KVM-E2E ]]; then
            echo "error: confirmation must be RUN-WINDOWS-KVM-E2E" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ || \
                "${CANDIDATE_SHA,,}" != "$GITHUB_SHA" ]]; then
            echo "error: candidate_sha must exactly match the selected master revision" >&2
            exit 1
          fi

  resolve-media:
    name: Resolve official Windows media
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.76.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create a private short-lived Microsoft download request
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.76.0 --profile minimal
          request="$RUNNER_TEMP/windows-media-request.lsw"
          cargo run --locked --release -p lsw-cli -- \
            media resolve --language English --request-file "$request"
          if [[ -L "$request" || ! -f "$request" || \
                "$(stat -c %a -- "$request")" != 600 ]]; then
            echo "error: LSW did not create a private media request" >&2
            exit 1
          fi

      - name: Transfer only the short-lived request to the KVM runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-media-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-media-request.lsw
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  windows-kvm-e2e:
    name: Windows 11 headless WinPE, agent, ConPTY, and cold restart
    needs: [authorize, resolve-media]
    environment: windows-kvm-e2e
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lsw-windows-kvm-e2e
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.76.0"
      LSW_WINDOWS_LINKER: mingw
      LSW_WINDOWS_EDITION: pro
      LSW_WINDOWS_PROFILE: slim
      LSW_E2E_TIMEOUT_SECONDS: "7200"
      LSW_E2E_NO_VIEWER: "1"
      LSW_E2E_KEEP_STATE: "0"
      LSW_E2E_MIN_FREE_GIB: "160"
    steps:
      - name: Initialize isolated build paths
        shell: bash
        env:
          JOB_BUILD_ROOT: ${{ runner.temp }}/lsw-windows-kvm-e2e/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            printf 'LSW_BUILD_ROOT=%s\n' "$JOB_BUILD_ROOT"
            printf 'CARGO_TARGET_DIR=%s/target\n' "$JOB_BUILD_ROOT"
          } >>"$GITHUB_ENV"

      - name: Receive the private Microsoft media request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-media-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LSW_BUILD_ROOT }}/media-request

      - name: Download and verify official Windows media
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aria2c >/dev/null 2>&1; then
            echo "error: aria2c is required to fetch official Windows media" >&2
            exit 1
          fi
          request="$LSW_BUILD_ROOT/media-request/windows-media-request.lsw"
          if [[ -L "$request" || ! -f "$request" || \
                "$(stat -c %s -- "$request")" -gt 8192 ]]; then
            echo "error: invalid Windows media request artifact" >&2
            exit 1
          fi
          chmod 600 -- "$request"
          mapfile -t fields <"$request"
          if (( ${#fields[@]} != 4 )) || [[ "${fields[0]}" != version=1 || \
                "${fields[1]}" != url=* || "${fields[2]}" != sha256=* || \
                "${fields[3]}" != filename=* ]]; then
            echo "error: malformed Windows media request artifact" >&2
            exit 1
          fi
          media_url=${fields[1]#url=}
          media_sha=${fields[2]#sha256=}
          media_name=${fields[3]#filename=}
          case "$media_url" in
            https://*.download.prss.microsoft.com/*\?*) ;;
            *) echo "error: media request is not an allowlisted Microsoft CDN URL" >&2; exit 1 ;;
          esac
          if [[ ! "$media_sha" =~ ^[0-9a-f]{64}$ || \
                ! "$media_name" =~ ^[A-Za-z0-9._-]+\.iso$ ]]; then
            echo "error: invalid official media identity" >&2
            exit 1
          fi

          media_directory="$LSW_BUILD_ROOT/media"
          media_path="$media_directory/windows.iso"
          input_file="$LSW_BUILD_ROOT/media-download.input"
          download_log="$LSW_BUILD_ROOT/media-download.log"
          mkdir -p -- "$media_directory"
          chmod 700 -- "$media_directory"
          printf '%s\n  out=windows.iso\n' "$media_url" >"$input_file"
          chmod 600 -- "$input_file"
          unset media_url
          if ! aria2c --input-file="$input_file" --dir="$media_directory" \
              --allow-overwrite=false --auto-file-renaming=false \
              --check-certificate=true --file-allocation=none \
              --max-connection-per-server=4 --split=4 \
              --console-log-level=warn --summary-interval=0 \
              >"$download_log" 2>&1; then
            sed -E 's#https://[^?[:space:]]+\?[^[:space:]]+#<redacted Microsoft URL>#g' \
              "$download_log" >&2
            exit 1
          fi
          rm -f -- "$input_file" "$download_log" "$request"
          actual_sha=$(sha256sum -- "$media_path" | awk '{ print $1 }')
          if [[ "$actual_sha" != "$media_sha" ]]; then
            echo "error: downloaded Windows media failed Microsoft's SHA-256" >&2
            exit 1
          fi
          chmod 400 -- "$media_path"
          {
            printf 'LSW_WINDOWS_ISO=%s\n' "$media_path"
            printf 'LSW_WINDOWS_ISO_SHA256=%s\n' "$media_sha"
          } >>"$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the trusted runner and release candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "error: candidate_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "$GITHUB_SHA" ]]; then
            echo "error: candidate_sha does not match the selected master revision" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "error: the checkout does not match GITHUB_SHA" >&2
            exit 1
          fi

          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "error: the runner does not have readable and writable /dev/kvm" >&2
            exit 1
          fi
          for command in \
            aria2c awk cargo df find findmnt git grep id python3 qemu-img \
            qemu-system-x86_64 realpath rustc rustup \
            setsid sha256sum smbd stat swtpm timeout tr \
            7z wimlib-imagex xorriso \
            x86_64-w64-mingw32-gcc; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "error: required runner command was not found: $command" >&2
              exit 1
            fi
          done
          if ! rustup target list --installed | \
             grep -Fx x86_64-pc-windows-gnu >/dev/null; then
            echo "error: Rust 1.76.0 is missing x86_64-pc-windows-gnu" >&2
            exit 1
          fi

          configured_ovmf_code=${LSW_OVMF_CODE:-}
          configured_ovmf_vars=${LSW_OVMF_VARS:-}
          if [[ -n "$configured_ovmf_code" || -n "$configured_ovmf_vars" ]]; then
            if [[ -z "$configured_ovmf_code" || -z "$configured_ovmf_vars" || \
                  "$configured_ovmf_code" != /* || "$configured_ovmf_vars" != /* || \
                  ! -r "$configured_ovmf_code" || ! -f "$configured_ovmf_code" || \
                  ! -r "$configured_ovmf_vars" || ! -f "$configured_ovmf_vars" ]]; then
              echo "error: LSW_OVMF_CODE and LSW_OVMF_VARS must name readable firmware files" >&2
              exit 1
            fi
          else
            ovmf_found=0
            firmware_pairs=(
              "/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd"
              "/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd"
              "/usr/share/edk2/x64/OVMF_CODE.fd|/usr/share/edk2/x64/OVMF_VARS.fd"
              "/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd"
            )
            for pair in "${firmware_pairs[@]}"; do
              ovmf_code=${pair%%|*}
              ovmf_vars=${pair#*|}
              if [[ -r "$ovmf_code" && -f "$ovmf_code" && \
                    -r "$ovmf_vars" && -f "$ovmf_vars" ]]; then
                ovmf_found=1
                break
              fi
            done
            if (( ovmf_found != 1 )); then
              echo "error: no supported OVMF code/variable firmware pair was found" >&2
              exit 1
            fi
          fi

          if [[ -z "${LSW_E2E_ROOT_BASE:-}" || "$LSW_E2E_ROOT_BASE" != /* || \
                ! -d "$LSW_E2E_ROOT_BASE" || ! -r "$LSW_E2E_ROOT_BASE" || \
                ! -w "$LSW_E2E_ROOT_BASE" || ! -x "$LSW_E2E_ROOT_BASE" ]]; then
            echo "error: LSW_E2E_ROOT_BASE must be an absolute, accessible directory" >&2
            exit 1
          fi
          canonical_e2e_root=$(realpath -e -- "$LSW_E2E_ROOT_BASE")
          if [[ "$canonical_e2e_root" != "$LSW_E2E_ROOT_BASE" ]]; then
            echo "error: LSW_E2E_ROOT_BASE must be canonical and must not be a symlink" >&2
            exit 1
          fi
          case "$canonical_e2e_root" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"|"$RUNNER_TEMP"/*)
              echo "error: the E2E root must be provisioned outside the Actions workspace and temp directory" >&2
              exit 1
              ;;
          esac
          e2e_filesystem=$(findmnt -n -o FSTYPE --target "$canonical_e2e_root")
          if [[ "$(stat -c %u -- "$canonical_e2e_root")" != "$(id -u)" || \
                "$(stat -c %a -- "$canonical_e2e_root")" != 700 ]]; then
            echo "error: the E2E root must be owned by the runner account with mode 0700" >&2
            if [[ "$e2e_filesystem" == 9p ]]; then
              echo "error: a WSL DrvFS root must be mounted separately with metadata, the runner UID/GID, and umask=077; see docs/WINDOWS_KVM_E2E.md" >&2
            fi
            exit 1
          fi
          case "$e2e_filesystem" in
            tmpfs|ramfs)
              echo "error: LSW_E2E_ROOT_BASE must use disk-backed storage" >&2
              exit 1
              ;;
          esac
          LC_ALL=C
          if (( ${#canonical_e2e_root} > 16 )); then
            echo "error: LSW_E2E_ROOT_BASE is too long for reliable AF_UNIX socket paths" >&2
            exit 1
          fi

          stale_e2e_root=$(find "$canonical_e2e_root" -mindepth 1 -maxdepth 1 \
            -type d -name 'lsw-e2e.??????' -print -quit)
          if [[ -n "$stale_e2e_root" ]]; then
            echo "error: stale Windows/KVM state must be removed before starting another gate: $stale_e2e_root" >&2
            exit 1
          fi

          storage_roots=("$canonical_e2e_root")
          if grep -qi microsoft /proc/sys/kernel/osrelease && [[ -d /mnt/c ]]; then
            storage_roots+=(/mnt/c)
          fi
          minimum_free_kib=$((LSW_E2E_MIN_FREE_GIB * 1024 * 1024))
          for storage_root in "${storage_roots[@]}"; do
            if [[ ! -d "$storage_root" || -L "$storage_root" ]]; then
              echo "error: E2E storage root must be an existing real directory: $storage_root" >&2
              exit 1
            fi
            available_kib=$(df -Pk -- "$storage_root" | awk 'NR == 2 { print $4; exit }')
            if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
              echo "error: could not measure free space for $storage_root" >&2
              exit 1
            fi
            if (( available_kib < minimum_free_kib )); then
              available_gib=$((available_kib / 1024 / 1024))
              echo "error: $storage_root has ${available_gib} GiB free; the Windows/KVM gate requires at least ${LSW_E2E_MIN_FREE_GIB} GiB" >&2
              exit 1
            fi
          done

          if [[ -z "${LSW_WINDOWS_ISO:-}" || -z "${LSW_WINDOWS_ISO_SHA256:-}" ]]; then
            echo "error: provision LSW_WINDOWS_ISO and LSW_WINDOWS_ISO_SHA256 on the runner" >&2
            exit 1
          fi
          if [[ "$LSW_WINDOWS_ISO" != /* || ! -f "$LSW_WINDOWS_ISO" || ! -r "$LSW_WINDOWS_ISO" ]]; then
            echo "error: LSW_WINDOWS_ISO must be an absolute, readable regular file" >&2
            exit 1
          fi
          canonical_iso=$(realpath -e -- "$LSW_WINDOWS_ISO")
          if [[ "$canonical_iso" != "$LSW_WINDOWS_ISO" ]]; then
            echo "error: LSW_WINDOWS_ISO must be canonical and must not be a symlink" >&2
            exit 1
          fi
          expected_generated_iso="${LSW_BUILD_ROOT%/}/media/windows.iso"
          case "$canonical_iso" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*|\
            "$canonical_e2e_root"|"$canonical_e2e_root"/*)
              echo "error: Windows media must be outside all Actions and E2E working directories" >&2
              exit 1
              ;;
          esac
          if [[ "$canonical_iso" == "$RUNNER_TEMP" || \
                "$canonical_iso" == "$RUNNER_TEMP"/* ]] && \
             [[ "$canonical_iso" != "$expected_generated_iso" ]]; then
            echo "error: unexpected Windows media path below the runner temp directory" >&2
            exit 1
          fi
          if [[ -w "$canonical_iso" ]]; then
            echo "error: Windows media must be read-only to the runner account" >&2
            exit 1
          fi

          expected_iso_sha=$(printf '%s' "$LSW_WINDOWS_ISO_SHA256" | tr 'A-F' 'a-f')
          if [[ ! "$expected_iso_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "error: LSW_WINDOWS_ISO_SHA256 is not a SHA-256 digest" >&2
            exit 1
          fi
          actual_iso_sha=$(sha256sum -- "$canonical_iso" | awk '{ print $1 }')
          if [[ "$actual_iso_sha" != "$expected_iso_sha" ]]; then
            echo "error: the provisioned Windows ISO failed SHA-256 verification" >&2
            exit 1
          fi

          mkdir -p -- "$LSW_BUILD_ROOT" "$CARGO_TARGET_DIR"
          chmod 700 -- "$LSW_BUILD_ROOT" "$CARGO_TARGET_DIR"

      - name: Build the host runtime and Windows agent
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p lsw-cli -p lsw-daemon
          scripts/build-windows-agent.sh

      - name: Run the real Windows/KVM gate
        shell: bash
        env:
          LSW_E2E_LSW: ${{ env.CARGO_TARGET_DIR }}/release/lsw
          LSW_E2E_LSWD: ${{ env.CARGO_TARGET_DIR }}/release/lswd
          LSW_WINDOWS_AGENT: ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-gnu/release/lsw-agent.exe
          LSW_E2E_ARTIFACT_DIR: ${{ env.LSW_BUILD_ROOT }}/artifacts
          LSW_E2E_ACTIVE_ROOT_FILE: ${{ env.LSW_BUILD_ROOT }}/active-e2e-root
        run: scripts/check-windows-kvm-e2e.sh

      - name: Remove local E2E state
        if: ${{ always() && env.LSW_BUILD_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          active_root_file="$LSW_BUILD_ROOT/active-e2e-root"
          if [[ ! -e "$active_root_file" ]]; then
            exit 0
          fi
          if [[ -L "$active_root_file" || ! -f "$active_root_file" ]]; then
            echo "error: refusing an invalid active E2E root record" >&2
            exit 1
          fi
          mapfile -t recorded_roots <"$active_root_file"
          if (( ${#recorded_roots[@]} != 1 )); then
            echo "error: refusing an ambiguous active E2E root record" >&2
            exit 1
          fi
          canonical_e2e_root=$(realpath -e -- "$LSW_E2E_ROOT_BASE")
          recorded_root=${recorded_roots[0]}
          recorded_parent=${recorded_root%/*}
          recorded_name=${recorded_root##*/}
          if [[ "$recorded_parent" != "$canonical_e2e_root" || \
                ! "$recorded_name" =~ ^lsw-e2e\.[[:alnum:]]{6}$ ]]; then
            echo "error: refusing cleanup of an unexpected E2E path: $recorded_root" >&2
            exit 1
          fi
          if [[ -L "$recorded_root" || ( -e "$recorded_root" && ! -d "$recorded_root" ) ]]; then
            echo "error: refusing cleanup of a non-directory E2E path: $recorded_root" >&2
            exit 1
          fi
          if [[ -d "$recorded_root" ]]; then
            chmod -R u+rwX -- "$recorded_root" || true
            find "$recorded_root" -depth -delete
          fi
          rm -f -- "$active_root_file"

      - name: Upload redacted gate evidence
        if: ${{ always() && env.LSW_BUILD_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-kvm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LSW_BUILD_ROOT }}/artifacts
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 14

      - name: Record the validated revision
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Windows/KVM release gate passed"
            echo
            echo "Validated commit: \`$GITHUB_SHA\`"
            echo
            echo "Only redacted gate evidence is retained; the short-lived media request, ISO, and VM state are deleted after the run."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove local build output
        if: ${{ always() && env.LSW_BUILD_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          expected_root="${RUNNER_TEMP%/}/lsw-windows-kvm-e2e/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$LSW_BUILD_ROOT" != "$expected_root" ]]; then
            echo "error: refusing cleanup of an unexpected path" >&2
            exit 1
          fi
          if [[ -d "$LSW_BUILD_ROOT" ]]; then
            chmod -R u+rwX -- "$LSW_BUILD_ROOT" || true
            find "$LSW_BUILD_ROOT" -depth -delete
          fi

  windows-seamless-e2e:
    name: Windows 11 signed-in WSLg seamless GUI matrix
    needs: authorize
    environment: windows-seamless-e2e
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lsw-windows-seamless-e2e
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.76.0"
      LSW_WINDOWS_LINKER: mingw
      LSW_SEAMLESS_E2E_TIMEOUT_SECONDS: "1800"
    steps:
      - name: Initialize isolated GUI build paths
        shell: bash
        env:
          JOB_BUILD_ROOT: ${{ runner.temp }}/lsw-windows-seamless-e2e/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p -- "$JOB_BUILD_ROOT/artifacts"
          chmod 700 -- "$JOB_BUILD_ROOT" "$JOB_BUILD_ROOT/artifacts"
          {
            printf 'LSW_GUI_BUILD_ROOT=%s\n' "$JOB_BUILD_ROOT"
            printf 'CARGO_TARGET_DIR=%s/target\n' "$JOB_BUILD_ROOT"
          } >>"$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the dedicated interactive WSLg runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ || \
                "${EXPECTED_SHA,,}" != "$GITHUB_SHA" || \
                "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "error: the GUI checkout must be the exact authorized candidate SHA" >&2
            exit 1
          fi
          if [[ -z "${WSL_DISTRO_NAME:-}" || -z "${WAYLAND_DISPLAY:-}" || \
                -z "${XDG_RUNTIME_DIR:-}" || "$WAYLAND_DISPLAY" == */* || \
                ! -S "${XDG_RUNTIME_DIR%/}/$WAYLAND_DISPLAY" ]]; then
            echo "error: start this runner from the signed-in user's interactive WSLg Wayland session" >&2
            exit 1
          fi
          for command in \
            awk base64 cargo convert git iconv identify powershell.exe readlink \
            rustc rustup setsid sha256sum timeout tr wslpath \
            x86_64-w64-mingw32-gcc; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "error: required signed-in WSLg runner command was not found: $command" >&2
              exit 1
            fi
          done
          if ! rustup target list --installed | \
             grep -Fx x86_64-pc-windows-gnu >/dev/null; then
            echo "error: Rust 1.76.0 is missing x86_64-pc-windows-gnu" >&2
            exit 1
          fi
          {
            printf 'candidate_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_contract=signed-in-wslg-wayland\n'
          } >"$LSW_GUI_BUILD_ROOT/artifacts/runner.env"
          chmod 600 -- "$LSW_GUI_BUILD_ROOT/artifacts/runner.env"

      - name: Build the exact GUI host runtime and Windows agent
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p lsw-cli -p lsw-daemon
          scripts/build-windows-agent.sh

      - name: Run the signed-in seamless GUI matrix
        shell: bash
        env:
          LSW_E2E_LSW: ${{ env.CARGO_TARGET_DIR }}/release/lsw
          LSW_DAEMON: ${{ env.CARGO_TARGET_DIR }}/release/lswd
          LSW_WINDOWS_AGENT: ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-gnu/release/lsw-agent.exe
        run: |
          set -euo pipefail
          candidate_agent="$LSW_WINDOWS_AGENT"
          expected_agent_sha=$(sha256sum -- "$candidate_agent" | awk '{ print $1; exit }')
          expected_daemon_sha=$(sha256sum -- "$LSW_DAEMON" | awk '{ print $1; exit }')
          daemon_status=$("$LSW_E2E_LSW" daemon status)
          daemon_pid=$(printf '%s\n' "$daemon_status" | \
            awk -F= '$1 ~ /^[[:space:]]*PID$/ && $2 ~ /^[0-9]+$/ { print $2; exit }')
          if [[ -z "$daemon_pid" || ! -r "/proc/$daemon_pid/exe" ]]; then
            echo "error: the pre-provisioned instance must use one running candidate lswd" >&2
            exit 1
          fi
          active_daemon_sha=$(sha256sum -- "/proc/$daemon_pid/exe" | awk '{ print $1; exit }')
          if [[ "$active_daemon_sha" != "$expected_daemon_sha" ]]; then
            echo "error: the active lswd does not match the exact candidate build" >&2
            exit 1
          fi
          {
            printf 'candidate_sha=%s\n' "$GITHUB_SHA"
            printf 'linux_cli_sha256=%s\n' "$(sha256sum -- "$LSW_E2E_LSW" | awk '{ print $1; exit }')"
            printf 'linux_daemon_sha256=%s\n' "$expected_daemon_sha"
            printf 'windows_agent_sha256=%s\n' "$expected_agent_sha"
          } >"$LSW_GUI_BUILD_ROOT/artifacts/attestation.env"
          chmod 600 -- "$LSW_GUI_BUILD_ROOT/artifacts/attestation.env"
          LSW_SEAMLESS_E2E_EXPECTED_AGENT_SHA256="$expected_agent_sha" \
            scripts/check-windows-seamless-e2e.sh \
            2>&1 | tee "$LSW_GUI_BUILD_ROOT/artifacts/seamless-e2e.log"

      - name: Upload redacted GUI gate evidence
        if: ${{ always() && env.LSW_GUI_BUILD_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-seamless-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LSW_GUI_BUILD_ROOT }}/artifacts
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 14

      - name: Record the validated GUI revision
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Signed-in WSLg seamless GUI gate passed"
            echo
            echo "Validated commit: \`$GITHUB_SHA\`"
            echo
            echo "The independent GUI job attested the candidate CLI, active daemon, and installed guest agent by SHA-256."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove local GUI build output
        if: ${{ always() && env.LSW_GUI_BUILD_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          expected_root="${RUNNER_TEMP%/}/lsw-windows-seamless-e2e/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$LSW_GUI_BUILD_ROOT" != "$expected_root" ]]; then
            echo "error: refusing cleanup of an unexpected GUI build path" >&2
            exit 1
          fi
          if [[ -d "$LSW_GUI_BUILD_ROOT" ]]; then
            chmod -R u+rwX -- "$LSW_GUI_BUILD_ROOT" || true
            find "$LSW_GUI_BUILD_ROOT" -depth -delete
          fi
