# SPDX-License-Identifier: GPL-3.0-or-later

name: Windows/KVM release gate
run-name: Windows/KVM gate for ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character master commit to validate
        required: true
        type: string
      confirmation:
        description: Type RUN-WINDOWS-KVM-E2E to use the dedicated runner
        required: true
        type: string
      keep_state:
        description: Retain local VM state on the runner only if the gate fails
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-kvm-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted or ambiguous dispatches
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 0x6Ason/lsw ]]; then
            echo "error: this gate can run only in 0x6Ason/lsw" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "error: select the master branch when dispatching this gate" >&2
            exit 1
          fi
          if [[ "$CONFIRMATION" != RUN-WINDOWS-KVM-E2E ]]; then
            echo "error: confirmation must be RUN-WINDOWS-KVM-E2E" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ || \
                "${CANDIDATE_SHA,,}" != "$GITHUB_SHA" ]]; then
            echo "error: candidate_sha must exactly match the selected master revision" >&2
            exit 1
          fi

  windows-kvm-e2e:
    name: Windows 11 WinPE, agent, ConPTY, and cold restart
    needs: authorize
    environment: windows-kvm-e2e
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lsw-windows-kvm-e2e
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.76.0"
      LSW_WINDOWS_LINKER: mingw
      LSW_WINDOWS_EDITION: pro
      LSW_WINDOWS_PROFILE: slim
      LSW_E2E_TIMEOUT_SECONDS: "2700"
      LSW_E2E_KEEP_STATE: ${{ inputs.keep_state && '1' || '0' }}
    steps:
      - name: Initialize isolated build paths
        shell: bash
        env:
          JOB_BUILD_ROOT: ${{ runner.temp }}/lsw-windows-kvm-e2e/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            printf 'LSW_BUILD_ROOT=%s\n' "$JOB_BUILD_ROOT"
            printf 'CARGO_TARGET_DIR=%s/target\n' "$JOB_BUILD_ROOT"
          } >>"$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the trusted runner and release candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "error: candidate_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA,,}" != "$GITHUB_SHA" ]]; then
            echo "error: candidate_sha does not match the selected master revision" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "error: the checkout does not match GITHUB_SHA" >&2
            exit 1
          fi

          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "error: the runner does not have readable and writable /dev/kvm" >&2
            exit 1
          fi
          if [[ -z "${DISPLAY:-}" && -z "${WAYLAND_DISPLAY:-}" ]]; then
            echo "error: the attended OOBE gate requires an interactive desktop session" >&2
            exit 1
          fi

          for command in \
            awk cargo findmnt git grep id python3 qemu-img \
            qemu-system-x86_64 realpath remote-viewer rustc rustup \
            script setsid sha256sum stat swtpm timeout tr \
            wimlib-imagex xorriso \
            x86_64-w64-mingw32-gcc; do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "error: required runner command was not found: $command" >&2
              exit 1
            fi
          done
          if ! rustup target list --installed | \
             grep -Fx x86_64-pc-windows-gnu >/dev/null; then
            echo "error: Rust 1.76.0 is missing x86_64-pc-windows-gnu" >&2
            exit 1
          fi

          configured_ovmf_code=${LSW_OVMF_CODE:-}
          configured_ovmf_vars=${LSW_OVMF_VARS:-}
          if [[ -n "$configured_ovmf_code" || -n "$configured_ovmf_vars" ]]; then
            if [[ -z "$configured_ovmf_code" || -z "$configured_ovmf_vars" || \
                  "$configured_ovmf_code" != /* || "$configured_ovmf_vars" != /* || \
                  ! -r "$configured_ovmf_code" || ! -f "$configured_ovmf_code" || \
                  ! -r "$configured_ovmf_vars" || ! -f "$configured_ovmf_vars" ]]; then
              echo "error: LSW_OVMF_CODE and LSW_OVMF_VARS must name readable firmware files" >&2
              exit 1
            fi
          else
            ovmf_found=0
            firmware_pairs=(
              "/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd"
              "/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd"
              "/usr/share/edk2/x64/OVMF_CODE.fd|/usr/share/edk2/x64/OVMF_VARS.fd"
              "/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd"
            )
            for pair in "${firmware_pairs[@]}"; do
              ovmf_code=${pair%%|*}
              ovmf_vars=${pair#*|}
              if [[ -r "$ovmf_code" && -f "$ovmf_code" && \
                    -r "$ovmf_vars" && -f "$ovmf_vars" ]]; then
                ovmf_found=1
                break
              fi
            done
            if (( ovmf_found != 1 )); then
              echo "error: no supported OVMF code/variable firmware pair was found" >&2
              exit 1
            fi
          fi

          if [[ -z "${LSW_E2E_ROOT_BASE:-}" || "$LSW_E2E_ROOT_BASE" != /* || \
                ! -d "$LSW_E2E_ROOT_BASE" || ! -r "$LSW_E2E_ROOT_BASE" || \
                ! -w "$LSW_E2E_ROOT_BASE" || ! -x "$LSW_E2E_ROOT_BASE" ]]; then
            echo "error: LSW_E2E_ROOT_BASE must be an absolute, accessible directory" >&2
            exit 1
          fi
          canonical_e2e_root=$(realpath -e -- "$LSW_E2E_ROOT_BASE")
          if [[ "$canonical_e2e_root" != "$LSW_E2E_ROOT_BASE" ]]; then
            echo "error: LSW_E2E_ROOT_BASE must be canonical and must not be a symlink" >&2
            exit 1
          fi
          case "$canonical_e2e_root" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"|"$RUNNER_TEMP"/*)
              echo "error: the E2E root must be provisioned outside the Actions workspace and temp directory" >&2
              exit 1
              ;;
          esac
          if [[ "$(stat -c %u -- "$canonical_e2e_root")" != "$(id -u)" || \
                "$(stat -c %a -- "$canonical_e2e_root")" != 700 ]]; then
            echo "error: the E2E root must be owned by the runner account with mode 0700" >&2
            exit 1
          fi
          e2e_filesystem=$(findmnt -n -o FSTYPE --target "$canonical_e2e_root")
          case "$e2e_filesystem" in
            tmpfs|ramfs)
              echo "error: LSW_E2E_ROOT_BASE must use disk-backed storage" >&2
              exit 1
              ;;
          esac
          LC_ALL=C
          if (( ${#canonical_e2e_root} > 16 )); then
            echo "error: LSW_E2E_ROOT_BASE is too long for reliable AF_UNIX socket paths" >&2
            exit 1
          fi

          if [[ -z "${LSW_WINDOWS_ISO:-}" || -z "${LSW_WINDOWS_ISO_SHA256:-}" ]]; then
            echo "error: provision LSW_WINDOWS_ISO and LSW_WINDOWS_ISO_SHA256 on the runner" >&2
            exit 1
          fi
          if [[ "$LSW_WINDOWS_ISO" != /* || ! -f "$LSW_WINDOWS_ISO" || ! -r "$LSW_WINDOWS_ISO" ]]; then
            echo "error: LSW_WINDOWS_ISO must be an absolute, readable regular file" >&2
            exit 1
          fi
          canonical_iso=$(realpath -e -- "$LSW_WINDOWS_ISO")
          if [[ "$canonical_iso" != "$LSW_WINDOWS_ISO" ]]; then
            echo "error: LSW_WINDOWS_ISO must be canonical and must not be a symlink" >&2
            exit 1
          fi
          case "$canonical_iso" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"|"$RUNNER_TEMP"/*|\
            "$canonical_e2e_root"|"$canonical_e2e_root"/*)
              echo "error: Windows media must be outside all Actions and E2E working directories" >&2
              exit 1
              ;;
          esac
          if [[ -w "$canonical_iso" ]]; then
            echo "error: Windows media must be read-only to the runner account" >&2
            exit 1
          fi

          expected_iso_sha=$(printf '%s' "$LSW_WINDOWS_ISO_SHA256" | tr 'A-F' 'a-f')
          if [[ ! "$expected_iso_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "error: LSW_WINDOWS_ISO_SHA256 is not a SHA-256 digest" >&2
            exit 1
          fi
          actual_iso_sha=$(sha256sum -- "$canonical_iso" | awk '{ print $1 }')
          if [[ "$actual_iso_sha" != "$expected_iso_sha" ]]; then
            echo "error: the provisioned Windows ISO failed SHA-256 verification" >&2
            exit 1
          fi

          mkdir -p -- "$LSW_BUILD_ROOT" "$CARGO_TARGET_DIR"
          chmod 700 -- "$LSW_BUILD_ROOT" "$CARGO_TARGET_DIR"

      - name: Build the host runtime and Windows agent
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p lsw-cli -p lsw-daemon
          scripts/build-windows-agent.sh

      - name: Run the real Windows/KVM gate
        shell: bash
        env:
          LSW_E2E_LSW: ${{ env.CARGO_TARGET_DIR }}/release/lsw
          LSW_E2E_LSWD: ${{ env.CARGO_TARGET_DIR }}/release/lswd
          LSW_WINDOWS_AGENT: ${{ env.CARGO_TARGET_DIR }}/x86_64-pc-windows-gnu/release/lsw-agent.exe
          LSW_E2E_ARTIFACT_DIR: ${{ env.LSW_BUILD_ROOT }}/artifacts
        run: scripts/check-windows-kvm-e2e.sh

      - name: Upload redacted gate evidence
        if: ${{ always() && env.LSW_BUILD_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-kvm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LSW_BUILD_ROOT }}/artifacts
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 14

      - name: Record the validated revision
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Windows/KVM release gate passed"
            echo
            echo "Validated commit: \`$GITHUB_SHA\`"
            echo
            echo "Only redacted gate evidence was uploaded; the ISO and VM state remained local."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain requested failed local diagnostic state
        if: ${{ failure() && inputs.keep_state }}
        shell: bash
        run: |
          echo "::warning::VM state was retained only below the dedicated runner's LSW_E2E_ROOT_BASE"
          echo "No VM disk or Windows media was uploaded."

      - name: Remove local build output
        if: ${{ always() && env.LSW_BUILD_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          expected_root="${RUNNER_TEMP%/}/lsw-windows-kvm-e2e/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$LSW_BUILD_ROOT" != "$expected_root" ]]; then
            echo "error: refusing cleanup of an unexpected path" >&2
            exit 1
          fi
          if [[ -d "$LSW_BUILD_ROOT" ]]; then
            chmod -R u+rwX -- "$LSW_BUILD_ROOT" || true
            find "$LSW_BUILD_ROOT" -depth -delete
          fi
