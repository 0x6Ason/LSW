name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.76.0 --profile minimal --component rustfmt,clippy
          rustup default 1.76.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows GNU target and linker
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64
      - name: Build guest agent
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --bin lsw-agent
