[workspace]
members = [
    "crates/lsw-cli",
    "crates/lsw-core",
    "crates/lsw-daemon",
    "crates/lsw-agent",
    "crates/lsw-host",
    "crates/lsw-protocol",
    "crates/lswg",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.8-dev.0"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-or-later"

# Every external dependency is declared once here, exact-pinned, and inherited
# by the member crates with `workspace = true`, so one bump updates the whole
# workspace and `cargo deny` sees a single policy surface.
[workspace.dependencies]
lsw-core = { path = "crates/lsw-core" }
lsw-host = { path = "crates/lsw-host" }
lsw-protocol = { path = "crates/lsw-protocol" }

getrandom = "=0.2.15"
md4 = "=0.10.2"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
sha2 = "=0.10.8"
signal-hook = "=0.3.17"
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
ureq = { version = "=2.10.1", default-features = false, features = ["tls"] }
url = "=2.5.0"
windows = "=0.54.0"
windows-core = "=0.54.0"
winit = { version = "=0.29.15", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
xml-rs = "=0.8.29"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
