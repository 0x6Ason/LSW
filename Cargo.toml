[workspace]
members = [
    "crates/lsw-cli",
    "crates/lsw-core",
    "crates/lsw-daemon",
    "crates/lsw-agent",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-or-later"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
