[package]
name = "lsw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LSW local Windows development runtime CLI"
publish = false

[[bin]]
name = "lsw"
path = "src/main.rs"

[dependencies]
lsw-core = { path = "../lsw-core" }
signal-hook = "=0.3.17"

[target.'cfg(unix)'.dependencies]
minifb = { version = "=0.25.0", default-features = false, features = ["dlopen", "wayland", "x11"] }
# minifb accepts any tempfile 3.x; keep the lockfile compatible with Rust 1.76.
tempfile = "=3.8.1"
