[package]
name = "lsw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LSW local Windows development runtime CLI"
publish = false

[[bin]]
name = "lsw"
path = "src/main.rs"

[dependencies]
lsw-core = { path = "../lsw-core" }
lsw-host = { path = "../lsw-host" }

[target.'cfg(unix)'.dependencies]
# winit accepts newer ahash 0.8 releases whose target-only dependency graph
# cannot be fully vendored by the project's Rust 1.76 toolchain.
ahash = "=0.8.11"
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
winit = { version = "=0.29.15", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
