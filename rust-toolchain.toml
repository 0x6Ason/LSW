#
# The one place the Rust toolchain is pinned. rustup reads this file for every
# cargo invocation in the workspace, so CI, release builds, and local checkouts
# use the same compiler. Keep `channel` equal to `rust-version` in Cargo.toml.
[toolchain]
channel = "1.76.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
